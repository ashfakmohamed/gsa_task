{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="{% static 'css/my_profile.css' %}">
</head>
<body>
    <header class="header">
        <div class="logo"><img src="{% static 'image/GSA-Logo.jpg' %}" alt="GSA"></div>
        <div class="add-task-btn"><a href="{% url 'task' %}">Add task</a></div>
    </header>
    <nav class="sidebar" aria-label="Account navigation">
        <ul>
            <li><a href="{% url 'dashboard' %}">My tasks</a></li>
            <li><a href="{% url 'my_profile' %}">My profile</a></li>
        </ul>
    </nav>
    <main>
        <h1>My Profile</h1>
        <div class="profile-card">
            <p><span class="profile-label">Name:</span> {{ request.user.get_full_name|default:request.user.username }}</p>
            <p><span class="profile-label">Email:</span> {{ request.user.email }}</p>
            <p><span class="profile-label">Mobile:</span> {{ profile.mobile_number|default:"Not provided" }}</p>
            <p><span class="profile-label">Address:</span> {{ profile.address|default:"Not provided" }}</p>
        </div>
    </main>
</body>
</html>
