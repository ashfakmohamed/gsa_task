{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <main class="login-container">
        <h1>Welcome back</h1>
        {% if messages %}
            {% for message in messages %}<p role="alert">{{ message }}</p>{% endfor %}
        {% endif %}
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p>Need an account? <a href="{% url 'register' %}">Register</a>.</p>
    </main>
</body>
</html>
